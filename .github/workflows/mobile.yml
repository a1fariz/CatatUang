name: Mobile
on:
  push:
    paths: ['mobile/**', 'backend/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'backend/**', '.github/workflows/mobile.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Make room on disposable build runner
        run: |
          # Unused by this Go/Flutter/Java workflow; affects only this CI VM.
          sudo rm -rf /usr/share/dotnet /opt/ghc
          df -h "$RUNNER_TEMP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/wrapper
          key: ${{ runner.os }}-catatuang-gradle-dependencies-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-catatuang-gradle-dependencies-
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --debug --no-pub --dart-define=API_BASE_URL=http://10.0.2.2:8080
      - name: Release signing must be explicitly configured
        run: |
          if (cd android && ./gradlew :app:assembleRelease --dry-run > /tmp/catatuang-release-guard.log 2>&1); then
            echo "Release unexpectedly accepted missing signing configuration"
            exit 1
          fi
          grep -F 'Release requires CATATUANG_KEYSTORE_PATH' /tmp/catatuang-release-guard.log
  transaction-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: catatuang
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: catatuang_mobile_sync
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U catatuang -d catatuang_mobile_sync"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgres://catatuang:ci_only_password@127.0.0.1:5432/catatuang_mobile_sync?sslmode=disable
      APP_ENV: test
      HTTP_ADDR: 127.0.0.1:18089
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: go build -o /tmp/catatuang-sync-api ./cmd/api
        working-directory: backend
      - run: go run ./cmd/migrate up
        working-directory: backend
      - run: go build -o /tmp/catatuang-sync-dataset ./cmd/sync-dataset
        working-directory: backend
      - run: flutter pub get
        working-directory: mobile
      - name: Two SQLite devices against the Go API
        env:
          SYNC_TEST_ROTATE_EXE: /tmp/catatuang-sync-dataset
        shell: bash
        run: |
          /tmp/catatuang-sync-api > /tmp/catatuang-sync-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18089/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18089/readyz
          cd mobile
          flutter test --no-pub --concurrency=1 --dart-define=SYNC_TEST_API_URL=http://127.0.0.1:18089 test/sync_backend_test.dart test/bill_sync_backend_test.dart
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: catatuang
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: catatuang_native
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U catatuang -d catatuang_native"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgres://catatuang:ci_only_password@127.0.0.1:5432/catatuang_native?sslmode=disable
      APP_ENV: test
      HTTP_ADDR: 127.0.0.1:18089
      ORG_GRADLE_PROJECT_catatUangIntegrationTest: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Enable KVM on disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make room on disposable native runner
        run: |
          df -h "$RUNNER_TEMP"
          # Neither SDK is used by this Go/Flutter/Java job. This runner is
          # ephemeral; no developer workstation or persisted AVD is touched.
          sudo rm -rf /usr/share/dotnet /opt/ghc
          df -h "$RUNNER_TEMP"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/wrapper
          key: ${{ runner.os }}-catatuang-gradle-dependencies-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-catatuang-gradle-dependencies-
      - run: go run ./cmd/migrate up && go build -o /tmp/catatuang-native-api ./cmd/api
        working-directory: backend
      - run: flutter pub get
        working-directory: mobile
      - name: Build isolated integration APKs before starting emulator
        run: |
          bash scripts/test-native-guard.sh
          bash scripts/build-native-ci.sh
        working-directory: mobile
      - name: Reclaim compilation space before creating disposable AVD
        run: |
          # APKs are already copied to RUNNER_TEMP and drive uses those binaries.
          # No native compilation follows. These paths belong only to this VM.
          test -f "$RUNNER_TEMP/catatuang-native-apks/account.apk"
          test -f "$RUNNER_TEMP/catatuang-native-apks/storage.apk"
          test "$ANDROID_HOME" = /usr/local/lib/android/sdk
          du -sh mobile/build "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" || true
          rm -rf mobile/build
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          # Version-specific Gradle transforms are large and cannot be used by
          # the prebuilt runtime tests. Retain dependency files for cache save.
          find "$HOME/.gradle/caches" -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' -exec rm -rf {} +
          df -h "$RUNNER_TEMP"
          available_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          test "$available_kb" -ge 12582912
      - name: Native plugins and account on fresh integration package
        # APK compilation is finished before starting QEMU.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/run-native-ci.sh
