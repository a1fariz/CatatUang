name: Mobile
on:
  push:
    paths: ['mobile/**', 'backend/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'backend/**', '.github/workflows/mobile.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --debug --no-pub --dart-define=API_BASE_URL=http://10.0.2.2:8080
  transaction-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: catatuang
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: catatuang_mobile_sync
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U catatuang -d catatuang_mobile_sync"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgres://catatuang:ci_only_password@127.0.0.1:5432/catatuang_mobile_sync?sslmode=disable
      APP_ENV: test
      HTTP_ADDR: 127.0.0.1:18089
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: go build -o /tmp/catatuang-sync-api ./cmd/api
        working-directory: backend
      - run: go run ./cmd/migrate up
        working-directory: backend
      - run: flutter pub get
        working-directory: mobile
      - name: Two SQLite devices against the Go API
        shell: bash
        run: |
          /tmp/catatuang-sync-api > /tmp/catatuang-sync-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18089/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18089/readyz
          cd mobile
          flutter test --no-pub --dart-define=SYNC_TEST_API_URL=http://127.0.0.1:18089 test/sync_backend_test.dart
