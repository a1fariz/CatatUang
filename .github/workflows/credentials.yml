name: Credential scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 -o "$archive" "$release/$archive"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 -o "$checksums" "$release/$checksums"
          grep "  $archive$" "$checksums" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan Git history with redacted output
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100 --no-banner'
