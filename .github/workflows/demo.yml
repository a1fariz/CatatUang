name: Demo artifacts
on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'Optional previous demo APK run; only if application source is unchanged'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: inputs.apk_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Prepare disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/wrapper
          key: ${{ runner.os }}-catatuang-gradle-dependencies-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-catatuang-gradle-dependencies-
      - run: flutter pub get
      - name: Build isolated offline demo
        run: |
          flutter build apk --debug --no-pub --target lib/main_demo.dart --dart-define=DEMO_BUILD=true
          mkdir -p "$RUNNER_TEMP/demo-artifacts"
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/demo-artifacts/catat-uang-demo.apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          "$aapt" dump badging "$RUNNER_TEMP/demo-artifacts/catat-uang-demo.apk" | grep -F "package: name='dev.catatuang.catat_uang.demo'"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/demo-artifacts/apk-source-commit.txt"
          (cd "$RUNNER_TEMP/demo-artifacts" && sha256sum catat-uang-demo.apk > apk-sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: catat-uang-demo-apk
          path: ${{ runner.temp }}/demo-artifacts/
          retention-days: 14
  capture:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: catat-uang-demo-apk
          path: ${{ runner.temp }}/demo-artifacts/
          run-id: ${{ inputs.apk_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify APK source matches application
        run: |
          apk_commit=$(cat "$RUNNER_TEMP/demo-artifacts/apk-source-commit.txt")
          [[ "$apk_commit" =~ ^[0-9a-f]{40}$ ]]
          git diff --exit-code "$apk_commit" "$GITHUB_SHA" -- mobile/lib mobile/android mobile/pubspec.yaml mobile/pubspec.lock
          (cd "$RUNNER_TEMP/demo-artifacts" && sha256sum --check apk-sha256.txt)
      - name: Prepare disposable capture runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          test "$ANDROID_HOME" = /usr/local/lib/android/sdk
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          df -h "$RUNNER_TEMP"
      - name: Capture actual UI and two-minute video
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb -s emulator-5554 install "$RUNNER_TEMP/demo-artifacts/catat-uang-demo.apk"
            cd mobile && dart tool/capture_demo.dart emulator-5554 "$RUNNER_TEMP/demo-artifacts"
      - name: Verify and encode two-minute presentation
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          raw="$RUNNER_TEMP/demo-artifacts/catat-uang-demo-raw.mp4"
          final="$RUNNER_TEMP/demo-artifacts/catat-uang-demo-2menit.mp4"
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$raw")
          awk -v duration="$duration" 'BEGIN { exit !(duration >= 120) }'
          ffmpeg -v error -y -i "$raw" -map 0:v:0 -t 120 -an -c:v libx264 -preset veryfast -crf 20 -r 30 -movflags +faststart "$final"
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$final")
          awk -v duration="$duration" 'BEGIN { exit !(duration >= 119.9 && duration <= 120.1) }'
          ffprobe -v error -show_entries format=duration:stream=width,height -of json "$final" > "$RUNNER_TEMP/demo-artifacts/video-probe.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catat-uang-demo
          path: |
            ${{ runner.temp }}/demo-artifacts/*.png
            ${{ runner.temp }}/demo-artifacts/*.xml
            ${{ runner.temp }}/demo-artifacts/*.mp4
            ${{ runner.temp }}/demo-artifacts/*.json
            ${{ runner.temp }}/demo-artifacts/*.txt
          retention-days: 14
