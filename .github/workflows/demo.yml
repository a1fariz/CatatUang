name: Demo artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Prepare disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
      - run: flutter pub get
      - name: Build isolated offline demo
        run: |
          flutter build apk --debug --no-pub --target lib/main_demo.dart --dart-define=DEMO_BUILD=true
          mkdir -p "$RUNNER_TEMP/demo-artifacts"
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/demo-artifacts/catat-uang-demo.apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          "$aapt" dump badging "$RUNNER_TEMP/demo-artifacts/catat-uang-demo.apk" | grep -F "package: name='dev.catatuang.catat_uang.demo'"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/demo-artifacts/apk-source-commit.txt"
          sha256sum "$RUNNER_TEMP/demo-artifacts/catat-uang-demo.apk" > "$RUNNER_TEMP/demo-artifacts/apk-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: catat-uang-demo-apk
          path: ${{ runner.temp }}/demo-artifacts/
          retention-days: 14
  capture:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: catat-uang-demo-apk
          path: ${{ runner.temp }}/demo-artifacts/
      - name: Prepare disposable capture runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          test "$ANDROID_HOME" = /usr/local/lib/android/sdk
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          df -h "$RUNNER_TEMP"
      - name: Capture actual UI and two-minute video
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb -s emulator-5554 install "$RUNNER_TEMP/demo-artifacts/catat-uang-demo.apk"
            cd mobile && dart tool/capture_demo.dart emulator-5554 "$RUNNER_TEMP/demo-artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catat-uang-demo
          path: ${{ runner.temp }}/demo-artifacts/
          retention-days: 14
